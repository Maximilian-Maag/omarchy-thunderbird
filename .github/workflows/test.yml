name: tests

# Policy as code runs here too, but as part of the full suite: every test kind the
# plugin promises (unit, regression, integration, e2e, js, shell) plus mutation testing.
on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the policy check diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The e2e kind boots a real headless Thunderbird against a throwaway profile.
      # Install it when the runner can; if it genuinely cannot, the e2e test skips
      # with a notice rather than failing the build.
      - name: Install Thunderbird (for the e2e kind)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq thunderbird \
          || echo "thunderbird unavailable on this runner; e2e will skip"
      - name: All test kinds (policy, unit, regression, integration, e2e, js, shell, mutation)
        run: bash tools/run_tests.sh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
